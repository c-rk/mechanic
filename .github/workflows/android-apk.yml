name: Android APK

# Builds a sideloadable release APK and publishes it as a GitHub Release.
# Runs on version tags (v*) and on demand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Install Android NDK
        run: |
          NDK=$(grep -o '^ndkVersion *= *"[^"]*"' node_modules/react-native/gradle/libs.versions.toml | grep -o '"[^"]*"' | tr -d '"')
          echo "NDK $NDK"
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" > /dev/null && break
            echo "retry $i"; rm -rf "$ANDROID_HOME/ndk/$NDK"; sleep 10
          done

      # arm64-v8a covers practically every Android phone from the last eight years and
      # halves build time and APK size compared with all four ABIs.
      # The release build is signed with the debug keystore from the Expo template, which is
      # fine for sideloading; replace it with an upload key before publishing to Play.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="bay-one-${VERSION}-${GITHUB_SHA::7}-arm64.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build.{1}', steps.apk.outputs.version, github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Bay One ${{ steps.apk.outputs.version }} (Android preview)
          prerelease: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            Sideloadable Android build of Bay One ${{ steps.apk.outputs.version }} (commit ${{ github.sha }}).

            **Install:** download the APK on the phone, open it, and allow "Install unknown apps" for your browser or file manager when Android asks.

            - arm64-v8a only (any 64-bit Android phone).
            - Signed with a development key: uninstall it before installing a Play Store build later.
            - For GPS drive recording with the screen off, set Location access for Bay One to "Allow all the time".
