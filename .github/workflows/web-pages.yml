name: Web build (GitHub Pages)

# Publishes the web version to the gh-pages branch on every push to the development branch.
on:
  push:
    branches: [ccr-8263c40e-u4euek]
    paths-ignore: ['worker/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch on-device segmentation model
        run: ./scripts/fetch-models.sh
      - name: Export web build
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      # Fill in the base path for icons and the manifest; serve index.html for deep links.
      - run: ./scripts/finish-web.sh /${{ github.event.repository.name }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
